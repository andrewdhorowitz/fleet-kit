name: play-api-verify

# Manual only. Read-verify for a package's internal track: lists track
# releases and internal tester membership via the dedicated play-api
# service account (fleet-kit PLAY_API_SERVICE_ACCOUNT_JSON secret).
# The script inserts a disposable edit, reads, and deletes it; nothing
# is ever committed. Key value never appears in logs.

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Android package name to verify"
        required: true
        default: "com.andrewdhorowitz.routinesandstreaks"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PLAY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_API_SERVICE_ACCOUNT_JSON }}
      VERIFY_PACKAGE: ${{ inputs.package }}
    steps:
      - name: Check secret present
        run: |
          if [ -z "$PLAY_API_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_API_SERVICE_ACCOUNT_JSON secret is not set on this repo."
            exit 1
          fi
          echo "Secret present."
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install auth dependency
        run: pip install --quiet google-auth cryptography
      - name: Run verify
        id: verify
        continue-on-error: true
        run: python scripts/play_api_verify.py 2>&1 | tee verify-output.txt
      - name: Publish verify output as job summary
        if: always()
        run: |
          {
            echo '## Play API verify output'
            echo '```'
            cat verify-output.txt || echo '(no output captured)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail the run if the verify failed
        if: steps.verify.outcome == 'failure'
        run: exit 1
