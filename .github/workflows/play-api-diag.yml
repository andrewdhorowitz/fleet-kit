name: play-api-diag

# Manual only. DIAGNOSTIC (read-only toward Play): compares the internal
# tracks of Routines Clarity and Homework Clarity via the play-api
# service account — tracks/releases + testers per track — and commits
# the findings as JSON under play-diag/ in this repo, because job logs
# and step summaries are not readable through the fleet PAT.
# The script inserts a disposable Play edit per package, reads, and
# deletes it; nothing is ever committed to Play. Key never printed.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      PLAY_API_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_API_SERVICE_ACCOUNT_JSON }}
      DIAG_OUT_DIR: play-diag
    steps:
      - name: Check secret present
        run: |
          if [ -z "$PLAY_API_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_API_SERVICE_ACCOUNT_JSON secret is not set on this repo."
            exit 1
          fi
          echo "Secret present."
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install auth dependency
        run: pip install --quiet google-auth cryptography
      - name: Run diagnostic
        id: diag
        continue-on-error: true
        run: python scripts/play_api_diag.py 2>&1 | tee diag-output.txt
      - name: Commit results JSON to repo
        if: always()
        run: |
          git config user.name "play-api-diag"
          git config user.email "play-api-diag@users.noreply.github.com"
          git add play-diag/results-routinesandstreaks.json play-diag/results-homeworkclarity.json || true
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "play-api-diag results ${{ github.run_id }}"
            git push origin HEAD:main
          fi
      - name: Fail the run if the diagnostic failed
        if: steps.diag.outcome == 'failure'
        run: exit 1
