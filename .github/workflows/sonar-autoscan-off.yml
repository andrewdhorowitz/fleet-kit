name: SonarCloud autoscan off (one-off)

# One-off maintenance job (Oct 30, 2026): disable SonarCloud Automatic
# Analysis on the fleet projects so CI-based analysis is the single
# method. Uses the repo's SONAR_TOKEN secret; writes its API evidence
# to sonar-autoscan-results.md and commits it. Manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autoscan-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable Automatic Analysis via SonarCloud API
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +e
          API=https://sonarcloud.io
          OUT=sonar-autoscan-results.md
          : > "$OUT"
          echo "# SonarCloud Automatic Analysis - disable run" >> "$OUT"
          echo "Run date (UTC): $(date -u +%FT%TZ)" >> "$OUT"
          echo >> "$OUT"
          echo "## All projects in org andrewdhorowitz" >> "$OUT"
          curl -s -u "$SONAR_TOKEN:" "$API/api/projects/search?organization=andrewdhorowitz&ps=100" > projects.json
          jq -r '.components[] | "- key=\(.key) name=\(.name)"' projects.json >> "$OUT" 2>/dev/null || cat projects.json >> "$OUT"
          KEYS=$(jq -r '.components[].key' projects.json | grep -E '_(aimf-protocol|routines-and-streaks|fleet-kit)$')
          echo >> "$OUT"
          echo "Matched project keys:" >> "$OUT"
          echo "$KEYS" >> "$OUT"
          for KEY in $KEYS; do
            echo >> "$OUT"
            echo "## $KEY" >> "$OUT"
            echo "### autoscan status (before)" >> "$OUT"
            curl -s -w '\nHTTP %{http_code}\n' -u "$SONAR_TOKEN:" "$API/api/autoscan/status?projectKey=$KEY" >> "$OUT"
            echo "### POST autoscan/deactivate" >> "$OUT"
            curl -s -w '\nHTTP %{http_code}\n' -X POST -u "$SONAR_TOKEN:" "$API/api/autoscan/deactivate?projectKey=$KEY" >> "$OUT"
            echo "### autoscan status (after)" >> "$OUT"
            curl -s -w '\nHTTP %{http_code}\n' -u "$SONAR_TOKEN:" "$API/api/autoscan/status?projectKey=$KEY" >> "$OUT"
          done
          cat "$OUT"

      - name: Commit results
        run: |
          git config user.name "fleet-automation"
          git config user.email "fleet-automation@users.noreply.github.com"
          git add sonar-autoscan-results.md
          git commit -m "SonarCloud autoscan-off: API results" || echo "nothing to commit"
          git push
