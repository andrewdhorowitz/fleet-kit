name: SonarCloud autoscan off (one-off)

# One-off maintenance job (Oct 30, 2026): disable SonarCloud Automatic
# Analysis on the fleet projects so CI-based analysis is the single
# method. Uses the repo's SONAR_TOKEN secret; writes its API evidence
# to sonar-autoscan-results.md and commits it. Manual dispatch only.
# v2: correct endpoint is POST /api/autoscan/activation (enable=false),
# and the live routines project key is andrewdhorowitz_routines-and-streaks2
# (andrewdhorowitz_routines-and-streaks is the ARCHIVE project - untouched).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autoscan-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disable Automatic Analysis via SonarCloud API
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +e
          API=https://sonarcloud.io
          OUT=sonar-autoscan-results.md
          : > "$OUT"
          echo "# SonarCloud Automatic Analysis - disable run (v2)" >> "$OUT"
          echo "Run date (UTC): $(date -u +%FT%TZ)" >> "$OUT"
          KEYS="andrewdhorowitz_aimf-protocol andrewdhorowitz_fleet-kit andrewdhorowitz_routines-and-streaks2"
          for KEY in $KEYS; do
            echo >> "$OUT"
            echo "## $KEY" >> "$OUT"
            echo "### GET autoscan/eligibility (before)" >> "$OUT"
            curl -s -w '\nHTTP %{http_code}\n' -u "$SONAR_TOKEN:" "$API/api/autoscan/eligibility?projectKey=$KEY" >> "$OUT"
            echo "### POST autoscan/activation enable=false" >> "$OUT"
            curl -s -w '\nHTTP %{http_code}\n' -X POST -u "$SONAR_TOKEN:" --data "enable=false&projectKey=$KEY" "$API/api/autoscan/activation" >> "$OUT"
            echo "### GET autoscan/eligibility (after)" >> "$OUT"
            curl -s -w '\nHTTP %{http_code}\n' -u "$SONAR_TOKEN:" "$API/api/autoscan/eligibility?projectKey=$KEY" >> "$OUT"
            echo "### GET settings/values grep autoscan (after)" >> "$OUT"
            curl -s -u "$SONAR_TOKEN:" "$API/api/settings/values?component=$KEY" | grep -i -A2 -B2 autoscan >> "$OUT" || echo "(no autoscan key in settings values)" >> "$OUT"
          done
          cat "$OUT"

      - name: Commit results
        run: |
          git config user.name "fleet-automation"
          git config user.email "fleet-automation@users.noreply.github.com"
          git add sonar-autoscan-results.md
          git commit -m "SonarCloud autoscan-off: API results (v2)" || echo "nothing to commit"
          git push
