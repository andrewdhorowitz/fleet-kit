name: text-bridge-worker-secrets

# Manual only. Hands Actions secrets to Cloudflare as secret bindings on
# the text-bridge-receiver Worker:
#   FIREBASE_SERVICE_ACCOUNT_JSON — Worker -> Firestore (Text Bridge v1)
#   GOOGLE_HOME_SA_JSON           — Worker -> Home Graph reporting
#                                   (Family Board Smart Home wake trigger)
#   SMART_HOME_LINK_CODE          — gate for the Smart Home
#                                   account-linking page
# Uses the fleet's own CF_API_TOKEN secret (deposited by
# scripts/cf-token-converge.sh) — no credential ever passes through chat,
# files, or Muse's vault.
#
# Secret hygiene: values travel only through env vars into a jq-built
# request body piped straight to curl. Nothing in this workflow prints a
# value, its length, or any fragment of it — steps report only names and
# the Cloudflare API's success flag.
#
# Behavior: a secret that is not set in Actions is skipped with a notice.
# The run fails only if CF_API_TOKEN is missing, if NONE of the Worker
# secrets are set, or if a PUT for a set secret is refused.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-worker-secrets:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: "2e2d28cfd77d3c1215cbe512c7fd2733"
      WORKER_SCRIPT: "text-bridge-receiver"
      SECRET_NAMES: "FIREBASE_SERVICE_ACCOUNT_JSON GOOGLE_HOME_SA_JSON SMART_HOME_LINK_CODE"
    steps:
      - name: Check which secrets are present
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_HOME_SA_JSON: ${{ secrets.GOOGLE_HOME_SA_JSON }}
          SMART_HOME_LINK_CODE: ${{ secrets.SMART_HOME_LINK_CODE }}
        run: |
          if [ -z "${CF_API_TOKEN:-}" ]; then echo "::error::CF_API_TOKEN secret is not set"; exit 1; fi
          present=0
          for name in $SECRET_NAMES; do
            if [ -n "${!name:-}" ]; then echo "$name: present"; present=1; else echo "$name: not set — will skip"; fi
          done
          if [ "$present" -eq 0 ]; then echo "::error::None of the Worker secrets are set in Actions"; exit 1; fi
          echo "CF_API_TOKEN present."

      - name: PUT each present secret to the Worker via Cloudflare API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_HOME_SA_JSON: ${{ secrets.GOOGLE_HOME_SA_JSON }}
          SMART_HOME_LINK_CODE: ${{ secrets.SMART_HOME_LINK_CODE }}
        run: |
          set -uo pipefail
          fail=0
          for name in $SECRET_NAMES; do
            value="${!name:-}"
            if [ -z "$value" ]; then echo "– skipped $name (not set)"; continue; fi
            response_file="$(mktemp)"
            http_code="$(jq -n \
                --arg name "$name" \
                --arg text "$value" \
                --arg type "secret_text" \
                '{name: $name, text: $text, type: $type}' \
              | curl -sS -o "$response_file" -w '%{http_code}' -X PUT \
                  "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_SCRIPT}/secrets" \
                  -H "Authorization: Bearer ${CF_API_TOKEN}" \
                  -H "Content-Type: application/json" \
                  --data @-)"
            echo "$name: Cloudflare API HTTP status: $http_code"
            success="$(jq -r '.success // false' "$response_file")"
            echo "$name: Cloudflare API success flag: $success"
            if [ "$success" != "true" ]; then
              echo "::error::Cloudflare refused the secret upload for $name. Error codes/messages from the API:"
              jq -c '.errors // []' "$response_file"
              fail=1
            else
              echo "✓ Worker secret $name is set on $WORKER_SCRIPT."
            fi
            rm -f "$response_file"
          done
          exit "$fail"
