name: text-bridge-worker-secrets

# Manual only. Hands the FIREBASE_SERVICE_ACCOUNT_JSON Actions secret to
# Cloudflare as a secret binding on the text-bridge-receiver Worker, so the
# Worker can write to Firestore (Text Bridge v1). Uses the fleet's own
# CF_API_TOKEN secret (deposited by scripts/cf-token-converge.sh) — no
# credential ever passes through chat, files, or Muse's vault.
#
# Secret hygiene: the service-account JSON travels only through env vars
# into a jq-built request body piped straight to curl. Nothing in this
# workflow prints the value, its length, or any fragment of it — steps
# report only the Cloudflare API's success flag.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-worker-secret:
    runs-on: ubuntu-latest
    env:
      CF_ACCOUNT_ID: "2e2d28cfd77d3c1215cbe512c7fd2733"
      WORKER_SCRIPT: "text-bridge-receiver"
      SECRET_NAME: "FIREBASE_SERVICE_ACCOUNT_JSON"
    steps:
      - name: Check required secrets are present
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          if [ -z "${CF_API_TOKEN:-}" ]; then echo "::error::CF_API_TOKEN secret is not set (run scripts/cf-token-converge.sh first)"; missing=1; fi
          if [ -z "${FIREBASE_SERVICE_ACCOUNT_JSON:-}" ]; then echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON secret is not set"; missing=1; fi
          [ "$missing" -eq 0 ] || exit 1
          echo "Both secrets are present."

      - name: PUT Worker secret via Cloudflare API
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          http_code="$(jq -n \
              --arg name "$SECRET_NAME" \
              --arg text "$FIREBASE_SERVICE_ACCOUNT_JSON" \
              --arg type "secret_text" \
              '{name: $name, text: $text, type: $type}' \
            | curl -sS -o "$response_file" -w '%{http_code}' -X PUT \
                "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/workers/scripts/${WORKER_SCRIPT}/secrets" \
                -H "Authorization: Bearer ${CF_API_TOKEN}" \
                -H "Content-Type: application/json" \
                --data @-)"
          echo "Cloudflare API HTTP status: $http_code"
          success="$(jq -r '.success // false' "$response_file")"
          echo "Cloudflare API success flag: $success"
          if [ "$success" != "true" ]; then
            echo "::error::Cloudflare refused the secret upload. Error codes/messages from the API:"
            jq -c '.errors // []' "$response_file"
            rm -f "$response_file"
            exit 1
          fi
          rm -f "$response_file"
          echo "✓ Worker secret $SECRET_NAME is set on $WORKER_SCRIPT."
